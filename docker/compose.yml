version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=ai_assistance
      - POSTGRES_PASSWORD=ai_assistance
      - POSTGRES_DB=ai_assistance
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_assistance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://ai_assistance:ai_assistance@postgres:5432/ai_assistance
    env_file:
      - path: ../backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - uploads_data:/app/data/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000

volumes:
  db_data:
  uploads_data:
